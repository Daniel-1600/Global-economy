# Render Blueprint for the Next.js frontend, Express API, PostgreSQL, and daily refresh.
services:
  - type: web
    name: global-economy-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: SERVER
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: global-economy-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: global-economy-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ECONOMY_REFRESH_TOKEN
        generateValue: true

  - type: web
    name: global-economy-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: global-economy-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: global-economy-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

